<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试时长统计汇总</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.85;
        }
        .tab-container {
            display: flex;
            background: #fff;
            border-bottom: 2px solid #e8e8e8;
            padding: 0 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .tab-btn {
            padding: 14px 28px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            color: #667eea;
            background: #f8f9ff;
        }
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }
        .tab-content {
            width: 100%;
            height: calc(100vh - 120px);
        }
        .tab-pane {
            display: none;
            width: 100%;
            height: 100%;
        }
        .tab-pane.active {
            display: block;
        }
        .tab-pane iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Infra测试车测试时长统计汇总</h1>
        <p>多周数据对比查看</p>
    </div>
    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('tab1')">2026-08-10 ~ 2026-08-14</button>
        <button class="tab-btn" onclick="switchTab('tab2')">2026-08-03 ~ 2026-08-07</button>
        <button class="tab-btn" onclick="switchTab('tab3')">2026-07-27 ~ 2026-07-31</button>
    </div>
    <div class="tab-content">
        <div id="tab1" class="tab-pane active">
            <iframe src="test_dashboard_2026-08-10_to_2026-08-14.html"></iframe>
        </div>
        <div id="tab2" class="tab-pane">
            <iframe src="test_dashboard_2026-08-03_to_2026-08-07.html"></iframe>
        </div>
        <div id="tab3" class="tab-pane">
            <iframe src="test_dashboard_2026-07-27_to_2026-07-31.html"></iframe>
        </div>
    </div>
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-container .tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
