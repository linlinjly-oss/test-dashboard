<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试时长统计汇总</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 220px; min-width: 220px; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; transition: margin-left 0.3s ease; position: relative; z-index: 10; }
        .sidebar.collapsed { margin-left: -220px; }
        .sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .sidebar-header h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .sidebar-header p { font-size: 11px; opacity: 0.6; }
        .sidebar-section { padding: 12px 0; }
        .sidebar-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.4); padding: 0 16px; margin-bottom: 8px; }
        .sidebar-item { display: block; width: 100%; padding: 10px 16px; border: none; background: transparent; color: rgba(255,255,255,0.7); font-size: 13px; text-align: left; cursor: pointer; transition: all 0.15s ease; border-left: 3px solid transparent; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .sidebar-item.active { background: rgba(102,126,234,0.15); color: #667eea; border-left-color: #667eea; font-weight: 600; }
        .toggle-btn { position: fixed; top: 12px; left: 12px; z-index: 100; width: 36px; height: 36px; border-radius: 8px; border: none; background: #667eea; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: left 0.3s ease; }
        .toggle-btn.shifted { left: 232px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .content-frame { flex: 1; width: 100%; height: 100%; }
        .content-frame iframe { width: 100%; height: 100%; border: none; }
        .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #999; font-size: 16px; background: #f5f7fa; }
    </style>
</head>
<body>
    <button class="toggle-btn shifted" id="toggleBtn" onclick="toggleSidebar()">☰</button>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>📊 测试时长统计</h2>
            <p>Infra测试车数据汇总</p>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">📅 周报</div>
            <button class="sidebar-item active" onclick="switchTab('week0', this)">08-24 ~ 08-28</button>
            <button class="sidebar-item" onclick="switchTab('week1', this)">08-17 ~ 08-21</button>
            <button class="sidebar-item" onclick="switchTab('week2', this)">08-10 ~ 08-14</button>
            <button class="sidebar-item" onclick="switchTab('week3', this)">08-03 ~ 08-07</button>
            <button class="sidebar-item" onclick="switchTab('week4', this)">07-27 ~ 07-31</button>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">📊 月报</div>
            <button class="sidebar-item" onclick="switchTab('month1', this)">2026年8月</button>
            <button class="sidebar-item" onclick="switchTab('month2', this)">2026年7月</button>
        </div>
    </aside>
    <main class="main-content">
        <div id="week0" class="content-frame active"><iframe src="test_dashboard_2026-08-24_to_2026-08-28.html"></iframe></div>
        <div id="week1" class="content-frame" style="display:none"><iframe src="test_dashboard_2026-08-17_to_2026-08-21.html"></iframe></div>
        <div id="week2" class="content-frame" style="display:none"><iframe src="test_dashboard_2026-08-10_to_2026-08-14.html"></iframe></div>
        <div id="week3" class="content-frame" style="display:none"><iframe src="test_dashboard_2026-08-03_to_2026-08-07.html"></iframe></div>
        <div id="week4" class="content-frame" style="display:none"><iframe src="test_dashboard_2026-07-27_to_2026-07-31.html"></iframe></div>
        <div id="month1" class="content-frame" style="display:none"><iframe src="test_dashboard_2026-08_monthly.html"></iframe></div>
        <div id="month2" class="content-frame" style="display:none"><iframe src="test_dashboard_2026-07_monthly.html"></iframe></div>
    </main>
    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.content-frame').forEach(f => f.style.display = 'none');
            document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');
        }
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('toggleBtn');
            sidebar.classList.toggle('collapsed');
            btn.classList.toggle('shifted');
        }
    </script>
</body>
</html>
