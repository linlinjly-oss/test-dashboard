function tsToDate(ts) {
    const d = new Date(ts + 8*3600*1000);
    return `07-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function timeToDecimal(t) {
    const p = t.trim().split(':');
    return parseInt(p[0]) + parseInt(p[1]||0)/60;
}

function buildChartData() {
    const sources = ['trigger测试','daily测试','研发自测'];
    const grouped = {};
    allData.forEach(r => {
        const date = tsToDate(r.ts);
        if (!grouped[date]) grouped[date] = {};
        if (!grouped[date][r.src]) grouped[date][r.src] = {minStart:24, maxEnd:0};
        const s = timeToDecimal(r.start), e = timeToDecimal(r.end);
        if (s < grouped[date][r.src].minStart) grouped[date][r.src].minStart = s;
        if (e > grouped[date][r.src].maxEnd) grouped[date][r.src].maxEnd = e;
    });
    const dates = Object.keys(grouped).sort();
    return {dates, grouped, sources};
}

function buildDurationData() {
    const sources = ['trigger测试','daily测试','研发自测'];
    const grouped = {};
    allData.forEach(r => {
        const date = tsToDate(r.ts);
        if (!grouped[date]) grouped[date] = {};
        grouped[date][r.src] = (grouped[date][r.src]||0) + r.hours;
    });
    const dates = Object.keys(grouped).sort();
    return {dates, grouped, sources};
}

    const {dates, grouped, sources} = buildChartData();

        'trigger测试': {start:'#27ae60', end:'#1abc9c'},
        'daily测试': {start:'#2980b9', end:'#3498db'},
        '研发自测': {start:'#e67e22', end:'#f39c12'}
    };

    // Chart 1: 折线图 - 每日开始/结束时间
    const datasets1 = [];
    sources.forEach(src => {
        const startData = dates.map(d => grouped[d]&&grouped[d][src] ? grouped[d][src].minStart : null);
        const endData = dates.map(d => grouped[d]&&grouped[d][src] ? grouped[d][src].maxEnd : null);
        datasets1.push({
            label: src + ' 开始',
            data: startData,
            borderColor: colors[src].start,
            backgroundColor: colors[src].start,
            borderWidth: 2,
            pointRadius: 3,
            tension: 0.3,
            spanGaps: true,
            borderDash: [],
        });
        datasets1.push({
            label: src + ' 结束',
            data: endData,
            borderColor: colors[src].end,
            backgroundColor: colors[src].end,
            borderWidth: 2,
            pointRadius: 3,
            tension: 0.3,
            spanGaps: true,
            borderDash: [5,3],
        });
    });

    new Chart(document.getElementById('chart1'), {
        type: 'line',
        data: { labels: dates, datasets: datasets1 },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(ctx) {
                            const v = ctx.raw;
                            if(v===null) return '';
                            const h = Math.floor(v), m = Math.round((v-h)*60);
                            return `${ctx.dataset.label}: ${h}:${String(m).padStart(2,'0')}`;
                        }
                    }
                }
            },
            scales: {
                y: {
                    min: 8,
                    max: 23,
                    reverse: false,
                    title: { display: true, text: '时间' },
                    ticks: {
                        callback: v => `${Math.floor(v)}:${String(Math.round((v%1)*60)).padStart(2,'0')}`,
                        stepSize: 1
                    }
                },
                x: { title: { display: true, text: '日期' } }
            }
        }
    });

    // Chart 2: 折线图 - 每日时长
    const dur = buildDurationData();
    const datasets2 = sources.map(src => ({
        label: src,
        data: dur.dates.map(d => dur.grouped[d]&&dur.grouped[d][src] ? dur.grouped[d][src] : null),
        borderColor: colors[src].start,
        backgroundColor: colors[src].start + '33',
        borderWidth: 2.5,
        pointRadius: 4,
        pointBackgroundColor: colors[src].start,
        tension: 0.3,
        spanGaps: true,
        fill: false,
    }));
    // 增加每日总时长线
    datasets2.push({
        label: '每日总时长',
        data: dur.dates.map(d => {
            let t = 0;
            sources.forEach(s => { if(dur.grouped[d]&&dur.grouped[d][s]) t += dur.grouped[d][s]; });
            return t > 0 ? t : null;
        }),
        borderColor: '#2c3e50',
        backgroundColor: '#2c3e5022',
        borderWidth: 3,
        pointRadius: 5,
        pointBackgroundColor: '#2c3e50',
        tension: 0.3,
        spanGaps: true,
        fill: false,
        borderDash: [6,3],
    });

    new Chart(document.getElementById('chart2'), {
        type: 'line',
        data: { labels: dur.dates, datasets: datasets2 },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: { display: false },
                tooltip: { callbacks: { label: ctx => ctx.raw!==null ? `${ctx.dataset.label}: ${ctx.raw.toFixed(1)}h` : '' } }
            },
            scales: {
                x: { title: { display: true, text: '日期' } },
                y: { title: { display: true, text: '时长(h)' }, beginAtZero: true }
            }
        }
    });

    // Duration summary table
    const triggerTotal = allData.filter(r=>r.src==='trigger测试').reduce((s,r)=>s+r.hours,0);
    const dailyTotal = allData.filter(r=>r.src==='daily测试').reduce((s,r)=>s+r.hours,0);
    const selfTotal = allData.filter(r=>r.src==='研发自测').reduce((s,r)=>s+r.hours,0);
    document.getElementById('durationTable').innerHTML = `
        <table style="max-width:500px;margin:15px auto 0;">
            <tr><th style="background:#27ae60">trigger测试</th><th style="background:#2980b9">daily测试</th><th style="background:#e67e22">研发自测</th><th>总计</th></tr>
            <tr><td><strong>${triggerTotal.toFixed(1)} h</strong></td><td><strong>${dailyTotal.toFixed(1)} h</strong></td><td><strong>${selfTotal.toFixed(1)} h</strong></td><td><strong>${totalH} h</strong></td></tr>
        </table>
    `;

    // Summary
    const srcTotals = {};
    allData.forEach(r => { srcTotals[r.src] = (srcTotals[r.src]||0) + r.hours; });
    const totalH = allData.reduce((s,r)=>s+r.hours,0).toFixed(1);
    document.getElementById('summary').innerHTML = `
        <div class="summary-card sc-purple"><h3>总测试时长</h3><div class="value">${totalH} h</div></div>
        <div class="summary-card sc-green"><h3>trigger测试</h3><div class="value">${(srcTotals['trigger测试']||0).toFixed(1)} h</div></div>
        <div class="summary-card sc-blue"><h3>daily测试</h3><div class="value">${(srcTotals['daily测试']||0).toFixed(1)} h</div></div>
        <div class="summary-card sc-orange"><h3>研发自测</h3><div class="value">${(srcTotals['研发自测']||0).toFixed(1)} h</div></div>
    `;
